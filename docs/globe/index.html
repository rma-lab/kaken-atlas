// 2D の縦横比を自前で保つ。fit=true は現在の範囲（自動範囲）全体が収まるよう両軸を等スケールに決め直す。
// fit=false は x の範囲を正として y の幅だけを画素比に合わせる（ずれが 0.1% 未満なら何もしない）。
// 自前のピンチ・フライトゥは両軸を同じ比率で変えるので通常は補正が走らず、ズームボックスや画面回転のときだけ働く
var equalScaleBusy = false;
function equalScale(fit) {
  var fl = plot._fullLayout, xa = fl.xaxis, ya = fl.yaxis;
  if (!xa || !ya || !xa._length || !ya._length || equalScaleBusy) return Promise.resolve();
  var xr = xa.range, yr = ya.range, W = xa._length, H = ya._length;
  var cx = (xr[0] + xr[1]) / 2, cy = (yr[0] + yr[1]) / 2, upp;
  if (fit) upp = Math.max((xr[1] - xr[0]) / W, (yr[1] - yr[0]) / H);
  else {
    upp = (xr[1] - xr[0]) / W;
    if (Math.abs((yr[1] - yr[0]) / H / upp - 1) < 1e-3) return Promise.resolve();
  }
  equalScaleBusy = true;
  var upd = { 'yaxis.range': [cy - upp * H / 2, cy + upp * H / 2] };
  if (fit) upd['xaxis.range'] = [cx - upp * W / 2, cx + upp * W / 2];

function updatePhase2() {
  document.getElementById('ka-bar2').style.width = (detLoaded / M.nShards * 100) + '%';
  document.getElementById('ka-p2-msg').textContent =
    '詳細データを読み込み中… ' + detLoaded + '/' + M.nShards;
}
var prefetchStartedAt = Date.now();
function startPrefetch() {
  prefetchStartedAt = Date.now();
  var p2 = document.getElementById('ka-phase2');
  p2.style.display = 'block';
  updatePhase2();
  var next = 0;
  function pump() {
    while (next < M.nShards && (det[next] || detPending[next])) next++;
    if (next >= M.nShards) {
      if (detLoaded >= M.nShards) finishPrefetch();
      return;
    }
    ensureShard(next++).catch(function () {}).then(function () { pump(); });
  }
  for (var i = 0; i < 4; i++) pump();
}
function finishPrefetch() {
  if (allLoaded) return;
  allLoaded = true;
  var q = document.getElementById('ka-q');
  if (q) { q.disabled = false; q.placeholder = narrow ? 'タイトル・番号で検索' : 'タイトル・キーワード・課題番号を検索'; }
  var p2 = document.getElementById('ka-phase2');
  // 端末に保存済み（Service Worker）で一瞬で終わった場合は完了表示を出さない。通常は 2 秒で消す
  if (Date.now() - prefetchStartedAt < 1500) { p2.style.display = 'none'; return; }
  document.getElementById('ka-bar2-wrap').style.display = 'none';
  document.getElementById('ka-p2-msg').textContent = '✓ 全データ読み込み完了';
  setTimeout(function () { p2.style.display = 'none'; }, 2000);
}

        }).join('') + '</text>';

// 3D の補完判定: Plotly の 3D は画素ぴったりの判定しかせず、小さい半透明の点では「点の上」でも
// 下地や空白と判定されることが多い。カメラ行列で全点を画面に投影し、カーソル最寄りの点（許容 tol px、
// 同点なら手前）を返す。20万点の投影は数ミリ秒
function proj3dSetup() {  // 現在のカメラの「データ座標→画面座標」行列と、球面の可視判定用の視点
  var sc = plot._fullLayout.scene && plot._fullLayout.scene._scene;
  if (!sc || !sc.glplot || !sc.glplot.cameraParams) return null;
  var cp = sc.glplot.cameraParams, ds = sc.dataScale || [1, 1, 1];
  var canvas = plot.querySelector('canvas'), rect = canvas.getBoundingClientRect();
  function mul(a, b) {  // 4x4 列優先 a*b
    var o = new Float64Array(16);
    for (var i = 0; i < 4; i++) for (var j = 0; j < 4; j++) {
      var v = 0; for (var k = 0; k < 4; k++) v += a[k * 4 + i] * b[j * 4 + k];
      o[j * 4 + i] = v;
    }
    return o;
  }
  var m = mul(cp.projection, mul(cp.view, cp.model));
  var E = null;
  if (isGlobe) {
    var v = cp.view;
    E = [-(v[0] * v[12] + v[1] * v[13] + v[2] * v[14]),
         -(v[4] * v[12] + v[5] * v[13] + v[6] * v[14]),
         -(v[8] * v[12] + v[9] * v[13] + v[10] * v[14])];
  }
  return { m: m, ds: ds, E: E, hw: rect.width / 2, hh: rect.height / 2, ox: rect.left + rect.width / 2, oy: rect.top + rect.height / 2 };
}

function project3d(g, P) {  // 1点の画面座標 [x, y]（裏側・カメラ後方なら null）
  P = P || proj3dSetup(); if (!P) return null;
  var m = P.m, x = xs[g] * P.ds[0], y = ys[g] * P.ds[1], z = zs[g] * P.ds[2];
  if (P.E && x * P.E[0] + y * P.E[1] + z * P.E[2] <= x * x + y * y + z * z) return null;
  var w = m[3] * x + m[7] * y + m[11] * z + m[15];
  if (w <= 0) return null;
  return [P.ox + (m[0] * x + m[4] * y + m[8] * z + m[12]) / w * P.hw,
          P.oy - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w * P.hh];
}

function projectXYZ(x0, y0, z0, P) {  // 任意のデータ座標 → [画面 x, 画面 y, 正面度]。球の裏側・カメラ後方なら null
  var m = P.m, x = x0 * P.ds[0], y = y0 * P.ds[1], z = z0 * P.ds[2], facing = 1;
  if (P.E) {
    var pe = x * P.E[0] + y * P.E[1] + z * P.E[2], pp = x * x + y * y + z * z;
    if (pe <= pp) return null;
    facing = pe / Math.sqrt(pp * (P.E[0] * P.E[0] + P.E[1] * P.E[1] + P.E[2] * P.E[2]));  // 視線の正面で 1、縁で小さい
  }
  var w = m[3] * x + m[7] * y + m[11] * z + m[15];
  if (w <= 0) return null;
  return [P.ox + (m[0] * x + m[4] * y + m[8] * z + m[12]) / w * P.hw,
          P.oy - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w * P.hh, facing];
}

function nearestGid3d(cx, cy, tol) {
  var P = proj3dSetup(); if (!P) return null;
  var m = P.m, ds = P.ds, E = P.E;
  var vis = M.traces.map(function (t, ti) { return t.k === 'd' && traceVisible(ti); });
  // 球面: 球に隠れる裏側の点を除外する（接平面条件 dot(P, E) > dot(P, P)。E は proj3dSetup で計算）
  var hw = P.hw, hh = P.hh, ox = P.ox, oy = P.oy;
  var best = null, bd = tol * tol, bz = Infinity;
  for (var g = 0; g < M.n; g++) {
    if (!vis[traceOf[g]]) continue;
    var x = xs[g] * ds[0], y = ys[g] * ds[1], z = zs[g] * ds[2];
    if (E && x * E[0] + y * E[1] + z * E[2] <= x * x + y * y + z * z) continue;  // 球の裏側
    var w = m[3] * x + m[7] * y + m[11] * z + m[15];
    if (w <= 0) continue;
    var sx = ox + (m[0] * x + m[4] * y + m[8] * z + m[12]) / w * hw;
    var sy = oy - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w * hh;
    var dx = sx - cx, dy = sy - cy, d2 = dx * dx + dy * dy;
    if (d2 > bd) continue;
    var nz = (m[2] * x + m[6] * y + m[10] * z + m[14]) / w;  // 小さいほど手前
    if (best === null || nz < bz - 1e-4 || (Math.abs(nz - bz) <= 1e-4 && d2 < bd)) { best = g; bd = Math.max(d2, 0); bz = nz; }
  }
  return best;
}

function hoverGid(gid) {  // 点にホバーした（Plotly 判定 or 補完判定）
  hoveredGid = gid;
  if (resolveTap(gid)) return;

  var tr = M.traces[traceOf[gid]];
  renderTip(gid, tr);
  if (!getRow(gid)) {
    ensureShard(shardOf(gid)).then(function () {
      if (hoveredGid === gid && selGid === null) renderTip(gid, tr);
    }).catch(function () {});
  }
}

function hoverNone() { hoveredGid = null; tip.style.display = 'none'; }

// 補完判定に使う位置: 待ち中のタップがあればその位置、タッチ端末は直前のタップ位置、PC はカーソル位置

function showRing(x, y) {

function isNearView() {

    var c = liveCamera(); var d = Math.hypot(c.eye.x - c.ctr.x, c.eye.y - c.ctr.y, c.eye.z - c.ctr.z);
    var d0 = homeCam ? Math.hypot(homeCam.eye.x - homeCam.ctr.x, homeCam.eye.y - homeCam.ctr.y, homeCam.eye.z - homeCam.ctr.z) : d;
    return isGlobe ? false : d < d0 * 0.7;  // 球面は距離を変えないので常に「全体」扱い（ボタンは「この点を正面に」）
  }

}

function toggleView() {

}

function copyText(text) {
  function legacy() {  // clipboard API が使えない／拒否された場合の予備（選択して copy コマンド）
    return new Promise(function (res, rej) {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); ok ? res() : rej(new Error('copy failed'));
    });
  }
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(legacy);
  return legacy();
}

function safeBottom() {  // iOS のホームバー分（env(safe-area-inset-bottom)）を px で
  if (!safeProbe) {
    safeProbe = document.createElement('div');
    safeProbe.style.cssText = 'position:fixed;left:-9999px;top:0;height:0;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(safeProbe);
  }
  return parseFloat(getComputedStyle(safeProbe).paddingBottom) || 0;
}

function placeCard(cx, cy) {  // 点（画面座標）と重ならない位置に置く
  var W = window.innerWidth, H = window.innerHeight;
  if (narrow) {  // スマホ幅: 基本は画面の下端。点が下端のカードと重なる位置のときだけ上端
    // （以前は下部に大区分ボタンがあり 64px 上げていた。ボタンをヘッダーへ移した後もその名残が残っていた。2026-09-09 修正）
    card.style.top = ''; card.style.bottom = '';
    // 下端に置いたときのカードの上辺を実測（safe-area は env() を読む要素で測る）。
    // 点のリングがその上辺に掛かるときだけ上端へ（上に出る状況を最小限にする。2026-09-09 ユーザ要望）
    var bottomTop = H - 12 - safeBottom() - card.offsetHeight;
    if (cy + RING / 2 + 2 > bottomTop) card.style.top = '56px';
    else card.style.bottom = 'calc(12px + env(safe-area-inset-bottom))';
    return;
  }
  var w = card.offsetWidth, h = card.offsetHeight, gap = 28;
  var left = cx + gap;                       // 原則は点の右側
  if (left + w > W - 8) left = cx - gap - w;  // 入らなければ左側
  if (left < 8) left = 8;
  card.style.left = left + 'px';
  card.style.top = Math.max(56, Math.min(cy - h / 2, H - h - 8)) + 'px';
}

function selectPoint(gid, cx, cy) {
  if (!is3d) { var pj = projected(gid); cx = pj[0]; cy = pj[1]; }  // 2Dは点の正確な位置に吸着
  selGid = gid; selXY = [cx, cy];
  var tr = M.traces[traceOf[gid]];
  tip.style.display = 'none';
  showRing(cx, cy);
  renderCard(gid, tr); placeCard(cx, cy);
  if (!getRow(gid)) {
    ensureShard(shardOf(gid)).then(function () {
      if (selGid === gid) { renderCard(gid, tr); placeCard(selXY[0], selXY[1]); }
    }).catch(function () {});
  }
}

// 地図を動かしたら選択点の位置を置き直す（リングは追随。PC のカードは点に付いて動く、スマホのカードは下端／上端に固定。

  // 平行移動）を掛けた空間で表される。model を掛け忘れると 3D（箱が原点対称でない）で注視点がずれる
  var sc = plot._fullLayout.scene._scene, ds = (sc && sc.dataScale) || [1, 1, 1];
  var sx = xs[gid] * ds[0], sy = ys[gid] * ds[1], sz = zs[gid] * ds[2];
  var mm = sc && sc.glplot && sc.glplot.cameraParams && sc.glplot.cameraParams.model;
  var px = sx, py = sy, pz = sz, upd;
  if (mm) {
    px = mm[0] * sx + mm[4] * sy + mm[8] * sz + mm[12];
    py = mm[1] * sx + mm[5] * sy + mm[9] * sz + mm[13];
    pz = mm[2] * sx + mm[6] * sy + mm[10] * sz + mm[14];
  }
  if (isGlobe) {
    var n = Math.hypot(px, py, pz) || 1, d = Math.hypot(eye.x, eye.y, eye.z);
    var ux = px / n, uy = py / n, uz = pz / n;
    var upv = Math.abs(uz) > 0.9 ? { x: 0, y: 1, z: 0 } : { x: 0, y: 0, z: 1 };  // 極付近では上向きを差し替え
    upd = { 'scene.camera.eye': { x: ux * d, y: uy * d, z: uz * d }, 'scene.camera.center': { x: 0, y: 0, z: 0 }, 'scene.camera.up': upv };
  } else {
    var dx = eye.x - ctr.x, dy = eye.y - ctr.y, dz = eye.z - ctr.z, len = Math.hypot(dx, dy, dz) || 1;
    var dist = Math.max(0.6, Math.min(len, 1.1));  // 近づきすぎない範囲で寄る（周辺が見える程度）
    upd = { 'scene.camera.center': { x: px, y: py, z: pz },

  }
  // 先に選択して（リング＋カード）、カメラを 1.2 秒かけて補間する。リングは追随で付いてくる
  var xy0 = project3d(gid) || [window.innerWidth / 2, window.innerHeight / 2];
  selectPoint(gid, xy0[0], xy0[1]);
  animateCamera(upd, 1200);
}

function animateCamera(target, ms) {
  var c0 = liveCamera();
  var e1 = target['scene.camera.eye'], c1 = target['scene.camera.center'], u1 = target['scene.camera.up'] || c0.up;
  var t0 = performance.now(), token = {};
  camAnim = token;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t }; }
  function step(now) {
    if (camAnim !== token) return;
    var t = Math.min(1, (now - t0) / ms), k = ease(t), eye;
    if (isGlobe) {  // 方向は slerp、距離は線形
      var d0 = Math.hypot(c0.eye.x, c0.eye.y, c0.eye.z), d1 = Math.hypot(e1.x, e1.y, e1.z);
      var a = { x: c0.eye.x / d0, y: c0.eye.y / d0, z: c0.eye.z / d0 }, b = { x: e1.x / d1, y: e1.y / d1, z: e1.z / d1 };
      var cosw = Math.max(-1, Math.min(1, a.x * b.x + a.y * b.y + a.z * b.z)), w = Math.acos(cosw), dir;
      if (w < 1e-4) dir = b;
      else { var sa = Math.sin((1 - k) * w) / Math.sin(w), sb = Math.sin(k * w) / Math.sin(w);
             dir = { x: a.x * sa + b.x * sb, y: a.y * sa + b.y * sb, z: a.z * sa + b.z * sb }; }
      var d = d0 + (d1 - d0) * k;
      eye = { x: dir.x * d, y: dir.y * d, z: dir.z * d };
    } else eye = lerp(c0.eye, e1, k);
    var upd = { 'scene.camera.eye': eye, 'scene.camera.center': lerp(c0.ctr, c1, k), 'scene.camera.up': t < 1 ? c0.up : u1 };
    Plotly.relayout(plot, upd).then(updateSelectionPos);
    if (t < 1) requestAnimationFrame(step); else camAnim = null;
  }

}

function liveCamera() {
  var sc = plot._fullLayout.scene && plot._fullLayout.scene._scene;
  var c = (sc && sc.getCamera) ? sc.getCamera() : (plot._fullLayout.scene.camera || {});
  var eye = c.eye || { x: 1.25, y: 1.25, z: 1.25 }, ctr = c.center || { x: 0, y: 0, z: 0 }, up = c.up || { x: 0, y: 0, z: 1 };
  return { eye: { x: eye.x, y: eye.y, z: eye.z }, ctr: { x: ctr.x, y: ctr.y, z: ctr.z }, up: { x: up.x, y: up.y, z: up.z } };
}

function focusPoint(gid) {

  var xy = projected(gid); selectPoint(gid, xy[0], xy[1]);  // 先に選択（現在の倍率でリング＋カード）
  var yh = yHalfSpanFor(NEAR_SPAN);  // 縦横比を保った着地範囲（scaleanchor なし）
  animateRange([xs[gid] - NEAR_SPAN, xs[gid] + NEAR_SPAN], [ys[gid] - yh, ys[gid] + yh], 1200);
}

function animateRange(xr1, yr1, ms) {
  var fl = plot._fullLayout, xr0 = fl.xaxis.range.slice(), yr0 = fl.yaxis.range.slice();
  var t0 = performance.now(), token = {};
  rangeAnim = token;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function mix(r0, r1, k) {  // 中心は線形、幅は対数補間
    var c0 = (r0[0] + r0[1]) / 2, c1 = (r1[0] + r1[1]) / 2, w0 = r0[1] - r0[0], w1 = r1[1] - r1[0];

    return [c - w / 2, c + w / 2];
  }

    if (rangeAnim !== token) return;
    var t = Math.min(1, (now - t0) / ms), k = ease(t);
    Plotly.relayout(plot, { 'xaxis.range': mix(xr0, xr1, k), 'yaxis.range': mix(yr0, yr1, k) }).then(placeSelection);
    if (t < 1) requestAnimationFrame(step); else rangeAnim = null;
  }
  requestAnimationFrame(step);
}

function runSearch(q) {
  clearHighlight();
  q = q.trim().toLowerCase();
  if (q.length < 2) return;
  var hits = [];
  for (var gid = 0; gid < M.n && hits.length < 2000; gid++) {
    var ti = traceOf[gid];
    if (!traceVisible(ti)) continue;
    var row = getRow(gid);
    if (!row) continue;
    var tr = M.traces[ti];
    var hay = (row[2] + '、' + row[3] + '、' + row[0] + '、' + catOf(gid, row)).toLowerCase();
    if (hay.indexOf(q) < 0) continue;
    hits.push({ gid: gid, row: row, tr: tr, cat: catOf(gid, row) });
  }
  if (!hits.length) {
    qResults.innerHTML = '<span style="color:' + MUTED + '">該当なし</span>';
    qResults.style.display = 'block';
    return;
  }
  var overlay = {
    x: hits.map(function (h) { return xs[h.gid]; }),
    y: hits.map(function (h) { return ys[h.gid]; }),
    mode: 'markers', hoverinfo: 'none', showlegend: false,
    marker: { size: is3d ? 4 : 9, color: 'rgba(11,11,11,0)',
              line: { width: 2, color: INK } },
    type: is3d ? 'scatter3d' : 'scattergl',
  };
  if (is3d) overlay.z = hits.map(function (h) { return zs[h.gid]; });
  Plotly.addTraces(plot, overlay).then(function () { hlIndex = plot.data.length - 1; });
  var html = '<b>' + fmt(hits.length) + (hits.length >= 2000 ? '+' : '') +
    '件ヒット</b><span style="color:' + MUTED + '">（先頭30件）</span><br>';
  hits.slice(0, 30).forEach(function (h, k) {
    html += '<a href="#" class="ka-hit" data-k="' + k + '" style="display:block;' +
      'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1c5cab;' +
      'text-decoration:none;padding:1px 0">' + esc((h.row[2] || '').slice(0, 48)) +
      ' <span style="color:' + MUTED + '">' + esc(h.cat + ' / ' + h.row[0]) +
      '</span></a>';
  });
  qResults.innerHTML = html;
  qResults.style.display = 'block';
  qResults.querySelectorAll('.ka-hit').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var h = hits[parseInt(a.getAttribute('data-k'), 10)];
      if (isTouch) qResults.style.display = 'none';  // スマホは結果窓が地図を覆うので閉じる（強調は残す）
      focusPoint(h.gid);
    });
  });
}

function updateClearBtn() { qClear.style.display = qInput.value ? 'block' : 'none'; }

function resetSearch() { qInput.value = ''; clearHighlight(); updateClearBtn(); }
function initSearch() {
  qInput = document.getElementById('ka-q');
  qResults = document.getElementById('ka-results');
  hlIndex = null;
  qTimer = null;
  // カメラの補間。球面は視線方向を球面補間（大円に沿って回る）、3D は eye/center を線形補間
  camAnim = null;
  // その課題へ移動して選択（検索ヒットのクリック、URL の ?award= で共用）
  window.focusPoint = focusPoint;
  NEAR_SPAN = 2.5;
  // 2D の範囲を補間（対数で、拡大率が一定の速さで変わるように）。リングは各フレームで追随
  rangeAnim = null;
  // 入力欄右端の × : 検索語・強調・結果窓をすべて消す。結果窓の外をクリック/タップ: 結果窓だけ閉じる
  // （地図上の強調は残す）。入力欄に戻れば結果窓を再表示する（2026-09-09 ユーザ仕様）
  qClear = document.getElementById('ka-q-clear');
  qClear.addEventListener('click', function (e) { e.preventDefault(); resetSearch(); if (!isTouch) qInput.focus(); });
  document.addEventListener('pointerdown', function (e) {
    if (qResults.style.display === 'none') return;
    var wrap = document.getElementById('ka-q-wrap');
    if (!wrap.contains(e.target)) qResults.style.display = 'none';
  }, true);
  qInput.addEventListener('focus', function () {
    if (qInput.value.trim().length >= 2 && qResults.innerHTML) qResults.style.display = 'block';
  });
  qInput.addEventListener('input', function () {
    updateClearBtn();
    if (qTimer) clearTimeout(qTimer);
    qTimer = setTimeout(function () { runSearch(qInput.value); }, 300);
  });
  qInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { resetSearch(); qInput.blur(); e.stopPropagation(); }
  });
}

// ---- 種目フィルタ ----
var counts;
var order;
var cats;
var boxes;
function setCategory(cat, on) {
  var idx = [], vis = [];
  plot.data.forEach(function (t, i) {
    if (t.meta !== cat) return;
    if (!on) { idx.push(i); vis.push(false); return; }
    var v = true;
    plot.data.some(function (s) {
      if (s.legendgroup === t.legendgroup && s.visible !== false) {
        v = (s.visible === undefined) ? true : s.visible;
        return true;
      }
      return false;
    });
    idx.push(i); vis.push(v);
  });
  if (idx.length) Plotly.restyle(plot, { visible: vis }, idx);
}
function initCategoryFilter() {
  counts = {};
  M.traces.forEach(function (t) {
    if (t.k === 'd') counts[t.cat] = (counts[t.cat] || 0) + t.n;
  });
  order = M.catOrder;
  cats = order.filter(function (c) { return counts[c] !== undefined; }).concat(
    Object.keys(counts).filter(function (c) { return order.indexOf(c) < 0; })
      .sort(function (a, b) { return counts[b] - counts[a]; }));
  document.getElementById('ka-body').innerHTML =
    '<a href="#" id="ka-selall" style="color:#1c5cab;text-decoration:none">全選択</a>&nbsp; ' +
    '<a href="#" id="ka-selnone" style="color:#1c5cab;text-decoration:none">全解除</a>' +
    cats.map(function (c) {
      return '<label style="display:block;white-space:nowrap;cursor:pointer">' +
        '<input type="checkbox" class="ka-cat" checked style="vertical-align:-2px"> ' +
        esc(c) + ' <span style="color:' + MUTED + '">' + fmt(counts[c]) + '</span></label>';
    }).join('');
  boxes = document.querySelectorAll('.ka-cat');
  boxes.forEach(function (cb, i) {
    cb.addEventListener('change', function () { setCategory(cats[i], cb.checked); });
  });
  document.getElementById('ka-selall').addEventListener('click', function (e) {
    e.preventDefault();
    boxes.forEach(function (cb, i) { cb.checked = true; setCategory(cats[i], true); });
  });
  document.getElementById('ka-selnone').addEventListener('click', function (e) {
    e.preventDefault();
    boxes.forEach(function (cb, i) { cb.checked = false; setCategory(cats[i], false); });
  });
}

// ---- 囲って集計（自前のなげなわ） ----
// Plotly の lasso/select は選択後に全トレースの選択状態を再計算する（点ごとの色配列では 20 万点 × 174 本で数秒。
// スマホでは固まって見える。2026-09-11）。ここでは Plotly の選択機能を使わず、画面座標で多角形を描いて
// 点の内外を自前で判定し（20 万点で数十 ms）、内訳とキーワードを集計する。強調表示はせず、輪郭線と集計パネルで示す。
var selPanel;
var lassoMode, lassoBtn, lassoSvg, lassoPath, lassoVeil, lassoPts, lassoData, lassoPointerId, lassoEndedAt;
function setLassoMode(on) {
  lassoMode = !!on;
  if (lassoSvg) {
    // 描いている間はポインタを受ける。結果表示中は表示だけして操作は下の地図へ通す
    lassoSvg.style.display = (lassoMode || lassoData) ? 'block' : 'none';
    lassoSvg.style.pointerEvents = lassoMode ? 'auto' : 'none';
  }
  if (lassoBtn) lassoBtn.classList.toggle('active', lassoMode);
  if (lassoMode) { lassoClearOutline(); clearSelection(); hoverNone(); }
}

function lassoClearOutline() {
  if (lassoPath) lassoPath.setAttribute('d', '');
  if (lassoVeil) lassoVeil.setAttribute('d', '');
  lassoPts = null; lassoData = null;
  if (lassoSvg && !lassoMode) lassoSvg.style.display = 'none';
}

function pathOf(pts) {
  var d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  for (var i = 1; i < pts.length; i++) d += 'L' + pts[i][0].toFixed(1) + ',' + pts[i][1].toFixed(1);
  return d + 'Z';
}

// 囲った多角形（データ座標）を現在の範囲で描き直す。地図を動かしても囲いが追随する
function lassoRender() {
  if (!lassoData || !lassoPath) return;
  var fl = plot._fullLayout, xr = fl.xaxis.range, yr = fl.yaxis.range, sz = fl._size;
  var sx = sz.w / (xr[1] - xr[0]), sy = sz.h / (yr[1] - yr[0]);
  var pts = lassoData.map(function (q) { return [sz.l + (q[0] - xr[0]) * sx, sz.t + (yr[1] - q[1]) * sy]; });
  // 膜は描画領域（軸の内側）だけにかけ、凡例やツールバーは霞ませない
  var x0 = sz.l, y0 = sz.t, x1 = sz.l + sz.w, y1 = sz.t + sz.h;
  lassoPath.setAttribute('d', pathOf(pts));
  lassoVeil.setAttribute('d', 'M' + x0 + ',' + y0 + 'H' + x1 + 'V' + y1 + 'H' + x0 + 'Z ' + pathOf(pts));
}

function closeSelPanel() { selPanel.style.display = 'none'; lassoClearOutline(); setLassoMode(false); }

function lassoLocal(e) {  // ポインタ位置 → plot 要素内の座標
  var r = plot.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function lassoDraw() {
  if (!lassoPts || lassoPts.length < 2) return;
  lassoPath.setAttribute('d', pathOf(lassoPts));
}

function topEntries(obj, n) {
  return Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; }).slice(0, n);
}

function summarizeGids(gids) {
  if (!gids.length) { selPanel.style.display = 'none'; lassoClearOutline(); return; }
  var n = gids.length, dais = {}, cts = {}, kws = {}, missing = 0;
  gids.forEach(function (gid) {
    var tr = M.traces[traceOf[gid]];
    dais[tr.dai] = (dais[tr.dai] || 0) + 1;
    var row = getRow(gid);
    var cat = tr.cat || (row ? M.cats[row[4]] : null);
    if (cat) cts[cat] = (cts[cat] || 0) + 1;
    if (!row) { missing++; return; }
    if (row[3]) {
      row[3].split('、').forEach(function (w) { if (w) kws[w] = (kws[w] || 0) + 1; });
    }
  });
  var html = '<div style="display:flex;align-items:center;gap:10px"><b style="flex:1">選択: ' + fmt(n) + '件</b>' +
    '<a href="#" id="ka-selclear" style="color:' + MUTED + ';padding:2px 10px;border:1px solid ' + LINE + ';border-radius:12px;' +
    'text-decoration:none;font-size:11.5px">閉じる ×</a></div>';
  html += '<span style="color:' + SUB + '">大区分:</span> ' + topEntries(dais, 5).map(function (g) {
    return esc(g) + ' ' + fmt(dais[g]);
  }).join(' / ') + '<br>';
  html += '<span style="color:' + SUB + '">種目:</span> ' + topEntries(cts, 4).map(function (c) {
    return esc(c) + ' ' + fmt(cts[c]);
  }).join(' / ') + '<br>';
  html += '<span style="color:' + SUB + '">頻出キーワード:</span>' +
    (missing ? ' <span style="color:' + MUTED + '">（読み込み中の' + fmt(missing) +
      '件は集計外）</span>' : '') + '<br>' +
    topEntries(kws, 10).map(function (w) {
      return '<span style="display:inline-block;background:#eef3fa;border:1px solid #c9d8ee;' +
        'border-radius:4px;padding:0 6px;margin:1px 2px">' + esc(w) +
        ' <span style="color:' + MUTED + '">' + kws[w] + '</span></span>';
    }).join('');
  selPanel.innerHTML = html;
  selPanel.style.display = 'block';
  document.getElementById('ka-selclear').addEventListener('click', function (e) {
    e.preventDefault(); closeSelPanel();
  });
}
function initLasso() {
  selPanel = document.createElement('div');
  selPanel.style.cssText = 'position:fixed;bottom:14px;left:14px;z-index:999;display:none;' +
    (narrow ? 'right:14px;max-height:40vh;' : 'max-width:400px;max-height:55vh;') + 'overflow-y:auto;padding:10px 14px;' + PANEL;
  document.body.appendChild(selPanel);
  lassoMode = false;
  lassoBtn = null;
  lassoSvg = null;
  lassoPath = null;
  lassoVeil = null;
  lassoPts = null;
  lassoData = null;
  lassoPointerId = null;
  lassoEndedAt = 0;
  window.kaToggleLasso = function () { setLassoMode(!lassoMode); };
  plot._dbgLasso = function () { return { mode: lassoMode, outline: !!(lassoPath && lassoPath.getAttribute('d')), veil: !!(lassoVeil && lassoVeil.getAttribute('d')), data: lassoData ? lassoData.length : 0, panel: selPanel.style.display }; };  // 検証用
  if (!is3d) {
    var mbBtns = plot.querySelectorAll('.modebar-btn');
    for (var bi = 0; bi < mbBtns.length; bi++) if (mbBtns[bi].getAttribute('data-title') === '囲って集計（なげなわ）') lassoBtn = mbBtns[bi];
    lassoSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    lassoSvg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;display:none;touch-action:none;cursor:crosshair';
    // 囲い終えた後は、囲いの外側に薄い膜をかけて内側だけ鮮やかに残す（evenodd の穴あき矩形。Plotly には触らないので軽い）
    lassoVeil = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    lassoVeil.setAttribute('fill', 'rgba(252,252,251,0.62)');
    lassoVeil.setAttribute('fill-rule', 'evenodd');
    lassoVeil.setAttribute('stroke', 'none');
    lassoSvg.appendChild(lassoVeil);
    lassoPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    lassoPath.setAttribute('fill', 'rgba(28,92,171,0.08)');
    lassoPath.setAttribute('stroke', '#1c5cab');
    lassoPath.setAttribute('stroke-width', '1.5');
    lassoPath.setAttribute('stroke-dasharray', '5 4');
    lassoSvg.appendChild(lassoPath);
    plot.style.position = 'relative';
    plot.appendChild(lassoSvg);
  }
  if (lassoSvg) {
    lassoSvg.addEventListener('pointerdown', function (e) {
      if (!lassoMode || lassoPointerId !== null) return;
      e.preventDefault(); e.stopPropagation();
      lassoPointerId = e.pointerId; lassoPts = [lassoLocal(e)];
      try { lassoSvg.setPointerCapture(e.pointerId); } catch (_) {}
    });
    lassoSvg.addEventListener('pointermove', function (e) {
      if (e.pointerId !== lassoPointerId) return;
      e.preventDefault();
      var q = lassoLocal(e), last = lassoPts[lassoPts.length - 1];
      if (Math.abs(q[0] - last[0]) + Math.abs(q[1] - last[1]) < 2) return;
      lassoPts.push(q); lassoDraw();
    });
    function lassoEnd(e) {
      if (e.pointerId !== lassoPointerId) return;
      lassoPointerId = null; lassoEndedAt = Date.now();
      var pts = lassoPts;
      if (!pts || pts.length < 3) { lassoClearOutline(); setLassoMode(false); return; }

        var s = Math.max(0.05, g3.d0 / tDist(e.touches));  // 指を広げる=s<1=近づく
        var cc = tCenter(e.touches), mx = cc[0] - g3.cx, my = cc[1] - g3.cy;
        // 球面は並行移動なし（球の中心を固定し、拡大縮小のみ）。3D は重心の移動で視点・注視点を平行移動
        var T = isGlobe ? v3(0, 0, 0) : vadd(vmul(bs.r, -mx * g3.k), vmul(bs.u, my * g3.k));
        applyCam({ eye: vadd(vadd(c.ctr, vmul(vsub(c.eye, c.ctr), s)), T), ctr: vadd(c.ctr, T), up: c.up });

}

// ---- 地名（キーワード地名。2D のみ） ----
// 密度の峰ごとに、その山域の課題のキーワードから作った 2 語を峰の位置に置く（scripts/compute_placenames.py が生成し、
// manifest の placenames に同梱）。公式区分は使わない。全体表示では出さず、拡大に応じて粗い階層→細かい階層を出す。
// SVG の重ね描き（なげなわと同じ流儀、pointer-events なし）なので点の操作は素通しで、地図を動かすと追随する。
var pnSvg, pnOn, pnLevel, pnShown, pnRaf, pnHomeGap, pnSig;
var PN_ZOOM = [1.5, 3.0];  // 階層ごとの表示開始倍率（全体表示の幅 ÷ 現在の幅）。狭幅は 1.25 倍厳しく
// 球面: 既定の距離で粗い階層を出し、近づいたら（球面までの距離が既定の 1/PN_ZOOM_GLOBE 以下）細かい階層に切り替える。
// 縁に近い地名は斜めに見えて点も詰まるので、正面度（視線とのなす角の余弦）が PN_FACING 未満は出さず、境目は薄くする
var PN_ZOOM_GLOBE = 1.5, PN_FACING = 0.6;
// 球面は点が詰まって見えるので地名を少なめに: 地名どうしの余白を広く取り、画面に出す数に上限（階層ごと。狭幅は 7 割）。ユーザ「文字が多い」2026-09-17
var PN_GLOBE_MAX = [7, 14], PN_GLOBE_PAD = [26, 14];
function pnTextWidth(s, fs) {  // 文字幅の見積もり（全角＝fs、半角＝0.58fs）
  var w = 0;
  for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 0x2e7f ? fs : fs * 0.58;
  return w;
}
function placenamesRenderGlobe() {
  var P = pnOn ? proj3dSetup() : null;
  if (!P || !P.E) { pnSvg.style.display = 'none'; pnLevel = -1; pnShown = 0; return; }
  var E = P.E, gap = Math.sqrt(E[0] * E[0] + E[1] * E[1] + E[2] * E[2]) - P.ds[0];  // 視点から球面までの距離
  if (!pnHomeGap) pnHomeGap = gap;
  var levels = M.placenames.levels, lv = (pnHomeGap / gap >= PN_ZOOM_GLOBE && levels.length > 1) ? 1 : 0;
  var r0 = plot.getBoundingClientRect();
  var x0 = P.ox - P.hw - r0.left, y0 = P.oy - P.hh - r0.top, x1 = x0 + 2 * P.hw, y1 = y0 + 2 * P.hh;
  var places = levels[lv].places.slice().sort(function (a, b) { return b.n - a.n; });
  var nMax = places[0].n, base = (lv === 0 ? 12 : 11) - (narrow ? 1 : 0);  // 球面は 2D より一回り小さく（ユーザ 2026-09-17）
  var boxes = [], html = '', shown = 0, cap = Math.round(PN_GLOBE_MAX[lv] * (narrow ? 0.7 : 1));
  for (var k = 0; k < places.length && shown < cap; k++) {
    var p = places[k], q = projectXYZ(p.x, p.y, p.z, P);
    if (!q || q[2] < PN_FACING) continue;
    var px = q[0] - r0.left, py = q[1] - r0.top;
    var fs = base + 2 * Math.sqrt(p.n / nMax), w = 0;
    for (var j = 0; j < p.w.length; j++) w = Math.max(w, pnTextWidth(p.w[j], fs));
    var h = fs * 1.25 * p.w.length;
    var bx0 = px - w / 2 - PN_GLOBE_PAD[0], by0 = py - h / 2 - PN_GLOBE_PAD[1], bx1 = px + w / 2 + PN_GLOBE_PAD[0], by1 = py + h / 2 + PN_GLOBE_PAD[1], hit = false;
    if (bx0 < x0 || bx1 > x1 || by0 < y0 || by1 > y1) continue;
    for (var b = 0; b < boxes.length; b++) {
      var bb = boxes[b];
      if (bx0 < bb[2] && bx1 > bb[0] && by0 < bb[3] && by1 > bb[1]) { hit = true; break; }
    }
    if (hit) continue;
    boxes.push([bx0, by0, bx1, by1]);
    shown++;
    var op = Math.min(1, (q[2] - PN_FACING) / 0.12), top = py - (p.w.length - 1) * fs * 1.25 / 2;
    html += '<text x="' + px.toFixed(1) + '" y="' + top.toFixed(1) + '" font-size="' + fs.toFixed(1) + '"' +
      (lv === 0 ? ' font-weight="500"' : '') + (op < 1 ? ' opacity="' + op.toFixed(2) + '"' : '') + '>';
    for (var m = 0; m < p.w.length; m++) {
      html += '<tspan x="' + px.toFixed(1) + '"' + (m ? ' dy="' + (fs * 1.25).toFixed(1) + '"' : '') + '>' + esc(p.w[m]) + '</tspan>';
    }

  pnSvg.innerHTML = html;
  pnSvg.style.display = 'block';
  pnLevel = lv; pnShown = shown;
}
// 球面はカメラの更新が描画ループ側で遅れ、慣性やフライ・トゥでも動き続けるので、毎フレーム投影行列の変化を見て描き直す
// （変化がなければ何もしない。行列の積 1 回なので軽い）
function placenamesWatchGlobe() {
  requestAnimationFrame(placenamesWatchGlobe);
  if (!pnSvg || !pnOn || document.hidden) return;
  var P = proj3dSetup(); if (!P) return;
  var sig = P.m[0].toFixed(4) + ',' + P.m[5].toFixed(4) + ',' + P.m[8].toFixed(4) + ',' + P.m[9].toFixed(4) + ',' + P.m[14].toFixed(3) + ',' + P.hw + ',' + P.hh;
  if (sig === pnSig) return;
  pnSig = sig;
  placenamesRenderGlobe();
}
function placenamesRender() {
  if (!pnSvg) return;
  if (isGlobe) { pnSig = null; placenamesRenderGlobe(); return; }
  var fl = plot._fullLayout, xa = fl.xaxis, ya = fl.yaxis;
  if (!pnOn || !xa || !ya || !homeRange || !xa._length) { pnSvg.style.display = 'none'; pnLevel = -1; pnShown = 0; return; }
  var xr = xa.range, yr = ya.range, sz = fl._size;
  var z = (homeRange.x[1] - homeRange.x[0]) / (xr[1] - xr[0]);
  var levels = M.placenames.levels, lv = -1;
  for (var i = 0; i < levels.length; i++) if (z >= PN_ZOOM[i] * (narrow ? 1.25 : 1)) lv = i;
  if (lv < 0) { pnSvg.style.display = 'none'; pnLevel = -1; pnShown = 0; return; }
  var sx = sz.w / (xr[1] - xr[0]), sy = sz.h / (yr[1] - yr[0]);
  var places = levels[lv].places.slice().sort(function (a, b) { return b.n - a.n; });
  var nMax = places[0].n, base = (lv === 0 ? 14 : 12) - (narrow ? 1 : 0);
  var boxes = [], html = '', shown = 0;
  var x0 = sz.l, y0 = sz.t, x1 = sz.l + sz.w, y1 = sz.t + sz.h;  // 描画領域（軸の内側）。凡例やツールバーには掛けない
  for (var k = 0; k < places.length; k++) {
    var p = places[k];
    var px = sz.l + (p.x - xr[0]) * sx, py = sz.t + (yr[1] - p.y) * sy;
    if (px < x0 || px > x1 || py < y0 || py > y1) continue;
    var fs = base + 3 * Math.sqrt(p.n / nMax);
    var w = 0;
    for (var j = 0; j < p.w.length; j++) w = Math.max(w, pnTextWidth(p.w[j], fs));
    var h = fs * 1.25 * p.w.length;
    var bx0 = px - w / 2 - 6, by0 = py - h / 2 - 3, bx1 = px + w / 2 + 6, by1 = py + h / 2 + 3, hit = false;
    if (bx0 < x0 || bx1 > x1 || by0 < y0 || by1 > y1) continue;  // 端で切れる地名は出さない
    for (var b = 0; b < boxes.length; b++) {
      var q = boxes[b];
      if (bx0 < q[2] && bx1 > q[0] && by0 < q[3] && by1 > q[1]) { hit = true; break; }
    }
    if (hit) continue;  // 件数の多い峰を優先し、重なる地名は省く
    boxes.push([bx0, by0, bx1, by1]);
    shown++;
    var top = py - (p.w.length - 1) * fs * 1.25 / 2;
    html += '<text x="' + px.toFixed(1) + '" y="' + top.toFixed(1) + '" font-size="' + fs.toFixed(1) + '"' +
      (lv === 0 ? ' font-weight="500"' : '') + '>';
    for (var m = 0; m < p.w.length; m++) {
      html += '<tspan x="' + px.toFixed(1) + '"' + (m ? ' dy="' + (fs * 1.25).toFixed(1) + '"' : '') + '>' + esc(p.w[m]) + '</tspan>';
    }
    html += '</text>';
  }
  pnSvg.innerHTML = html;
  pnSvg.style.display = 'block';
  pnLevel = lv; pnShown = shown;
}
function placenamesSchedule() {
  if (pnRaf) return;
  pnRaf = requestAnimationFrame(function () { pnRaf = 0; placenamesRender(); });
}
function initPlacenames() {
  pnSvg = null; pnOn = false; pnLevel = -1; pnShown = 0; pnRaf = 0; pnHomeGap = 0; pnSig = null;
  plot._dbgPlacenames = function () { return { on: pnOn, level: pnLevel, shown: pnShown, svg: !!pnSvg }; };  // 検証用
  if (!M.placenames || (is3d && !isGlobe)) return;  // 3D は奥行きで地名が重なり、どの塊を指すか分からなくなるので付けない
  try { pnOn = localStorage.getItem('ka-placenames') !== '0'; } catch (_) { pnOn = true; }
  pnSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  pnSvg.setAttribute('id', 'ka-placenames');
  pnSvg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;display:none;pointer-events:none;' +
    'font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;fill:' + SUB + ';text-anchor:middle;' +
    'dominant-baseline:middle;paint-order:stroke;stroke:#fcfcfb;stroke-width:3.5px;stroke-linejoin:round;opacity:0.9';  // 文字は黒でなくグレー（ユーザ「文字が強い」2026-09-17）
  plot.style.position = 'relative';
  plot.appendChild(pnSvg);
  if (isGlobe) placenamesWatchGlobe();

    plot.on('plotly_relayouting', placenamesSchedule);

  window.addEventListener('resize', function () { setTimeout(placenamesRender, 150); });
  // 表示切替は「操作」（狭幅は羅針盤メニューの「操作の説明」）の先頭に。設定は端末に記憶
  var help = document.getElementById('ka-help-body');
  if (help) {
    var row = document.createElement('div');
    row.style.cssText = 'padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid ' + LINE;
    row.innerHTML = '<label style="cursor:pointer"><input type="checkbox" id="ka-pn-toggle"' + (pnOn ? ' checked' : '') +
      ' style="vertical-align:-2px"> 地名を表示（' + (isGlobe ? '研究が密集している場所ごとに、周辺の課題のキーワードから作った地名です。近づくと細かい地名に切り替わります'
        : '拡大すると、研究が密集している場所ごとに、周辺の課題のキーワードから作った地名が出ます') + '）</label>';
    help.insertBefore(row, help.firstChild);
    document.getElementById('ka-pn-toggle').addEventListener('change', function (e) {
      pnOn = !!e.target.checked;
      try { localStorage.setItem('ka-placenames', pnOn ? '1' : '0'); } catch (_) {}

}
