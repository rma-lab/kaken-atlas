[project]
name = "kaken-atlas"
version = "0.1.0"
description = "KAKEN Atlas of Latent Academic Structures — 科研費データを用いた学術知識の構造化と研究評価の新指標開発"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Takayuki Ogi", email = "takayuki1997@gmail.com" }]
dependencies = []

[project.urls]
Repository = "https://github.com/takayuki-ogi/kaken-atlas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaken_atlas"]

[dependency-groups]
# Development-only tools (installed by `uv sync`, excluded from wheels).
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Sensible default set: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
