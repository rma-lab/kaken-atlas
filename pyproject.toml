[project]
name = "kaken-atlas"
version = "0.1.0"
description = "KAKEN Atlas of Latent Academic Structures — 科研費データを用いた学術知識の構造化と研究評価の新指標開発"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Takayuki Ogi", email = "takayuki1997@gmail.com" }]
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "polars>=1.42.1",
    "sentence-transformers>=5.7.0",
    # Linux(HAKUSAN) は cu128 ビルドの上限が 2.11 のため下限を 2.11 に置く（Mac は最新が入る）
    "torch>=2.11.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
]

[project.urls]
Repository = "https://github.com/takayuki1997/kaken-atlas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaken_atlas"]

[dependency-groups]
# Development-only tools (installed by `uv sync`, excluded from wheels).
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.uv.sources]
# HAKUSAN の GPU ノードはドライバが CUDA 12.9 世代（2026-08 実測）。
# PyPI 既定の torch は CUDA 13 ビルドで動かないため、Linux のみ cu128 を使う。
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Sensible default set: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# テストの XML フィクスチャは実データの構造を保つため行長を許容する。
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
